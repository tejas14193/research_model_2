name: Daily update

on:
  schedule:
    # 13:05 UTC = 18:35 IST, Monday to Friday (after market close). Backup only:
    # the Cloudflare timer (tools/timer) starts the run on time.
    - cron: "5 13 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "update = fetch and publish; deploy-only = publish current data"
        default: update
        type: choice
        options: [update, deploy-only]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node tools/test.js
      - name: Fetch from Screener
        if: github.event_name == 'schedule' || inputs.mode != 'deploy-only'
        env:
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
        run: node tools/update.js
      - name: Commit data
        if: github.event_name == 'schedule' || inputs.mode != 'deploy-only'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily data $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')"
          git push
      - name: Build site
        run: |
          mkdir -p _site
          cp index.html engine.js rules.json _site/
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
